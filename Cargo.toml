[workspace]
resolver = "2"
members = ["adapter", "check"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# The knobas revision whose SDK and host this adapter is built and checked
# against. The SDK's version is the `knobas:adapter` interface it binds
# (1.7.0 at this revision, on knobas' `ux30-signin` branch until a release
# carries it); the manifest's `interface_version` says the same. The frozen
# 1.6.0 and 1.5.0 worlds build from the same revision (`INTERFACE=1.6.0` or
# `INTERFACE=1.5.0 scripts/build.sh`).
[workspace.dependencies]
knobas-adapter-sdk = { git = "https://github.com/BFoerschner/knobas", rev = "f830aac1fdbf65ebe576b1fc38c1c016e49c5915" }
knobas-wasm-host = { git = "https://github.com/BFoerschner/knobas", rev = "f830aac1fdbf65ebe576b1fc38c1c016e49c5915" }
knobas-source = { git = "https://github.com/BFoerschner/knobas", rev = "f830aac1fdbf65ebe576b1fc38c1c016e49c5915" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

[profile.release]
# A component is downloaded by every reader who installs it: keep it small.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
