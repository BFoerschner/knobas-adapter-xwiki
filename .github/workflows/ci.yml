name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the channel, the components and the
      # wasm32-wasip2 target; rustup installs them on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p knobas-adapter-xwiki --target wasm32-wasip2 -- -D warnings
      - run: cargo test --workspace
      # The component, its manifest, and the checks knobas runs at install,
      # with knobas' own WASM host. The live checks need an XWiki and run on
      # the author's machine (README, "Testing").
      - run: scripts/build.sh
      - run: cargo run -q -p check -- static dist/knobas-adapter.json
